<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Wymuszenie ciemnego stylu paska i koloru w iOS Safari -->
    <meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dc2626" media="(prefers-color-scheme: light)" />
    
    <!-- Kluczowa linijka dla iOS: 'black-translucent' sprawia, że tło aplikacji wchodzi pod pasek i przejmuje styl -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    
    <!-- Tailwind CSS z CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <title>MegaDex GO</title>
  </head>
